spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/carwash_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 交給 Flyway 管理 schema，Hibernate 只負責驗證
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  mail:
    host: localhost
    port: 25
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

jwt:
  # 請勿將正式環境的 secret 寫死在版控裡，改用環境變數或 Vault/Secrets Manager 注入
  # 產生範例：openssl rand -base64 32
  secret: ${JWT_SECRET:CHANGE_THIS_TO_A_RANDOM_32BYTE_SECRET_BEFORE_DEPLOY}
  expiration-ms: 86400000   # 24 小時

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method   # 同一個 Tag 內依 HTTP method 排序
    tagsSorter: alpha
  # 正式環境建議關閉，只在開發/測試環境開放，避免 API 結構外洩
  # api-docs.enabled: false
