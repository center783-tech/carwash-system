spring:
  # 明確載入專案根目錄的 .env，避免 IDE 啟動時未注入 DB_* 環境變數
  config:
    import: file:./.env[.properties]
  # 本機已使用 Windows MySQL80 服務，避免 Spring Boot 嘗試啟動空的 compose.yaml
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 交給 Flyway 管理 schema，Hibernate 只負責驗證
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seeder            
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  #gmail 設定    
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

          ssl:
            trust: smtp.gmail.com

          quitwait: false

    default-encoding: UTF-8

# 前端網址：優惠券通知信裡的連結會用到，正式環境請設定環境變數 APP_BASE_URL
app:
  base-url: ${APP_BASE_URL:http://localhost:5174/carwash}

server:
  port: ${SERVER_PORT}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

jwt:
  # 請勿將正式環境的 secret 寫死在版控裡，改用環境變數或 Vault/Secrets Manager 注入
  # 產生範例：openssl rand -base64 32
  secret: ${JWT_SECRET}
  expiration-ms: 86400000   # 24 小時

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method   # 同一個 Tag 內依 HTTP method 排序
    tagsSorter: alpha
  # 正式環境建議關閉，只在開發/測試環境開放，避免 API 結構外洩
  # api-docs.enabled: false
