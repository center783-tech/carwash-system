spring:
  # 明確載入專案根目錄的 .env，避免 IDE 啟動時未注入 DB_* 環境變數
  config:
    import: file:./.env[.properties]
  # 本機已使用 Windows MySQL80 服務，避免 Spring Boot 嘗試啟動空的 compose.yaml
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 交給 Flyway 管理 schema，Hibernate 只負責驗證
    show-sql: ${JPA_SHOW_SQL:false}   # 本機除錯時在 .env 設 JPA_SHOW_SQL=true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seeder            
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  #gmail 設定    
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

          ssl:
            trust: smtp.gmail.com

          quitwait: false

    default-encoding: UTF-8

# 前端網址：優惠券通知信裡的連結會用到，正式環境請設定環境變數 APP_BASE_URL
app:
  base-url: ${APP_BASE_URL:http://localhost:5174/carwash}
  cors:
    # 允許跨來源呼叫 API 的前端網域（逗號分隔，不含路徑與結尾斜線）。
    # 經 Nginx 反向代理時，瀏覽器送出的 Origin 仍會被當成跨來源檢查，所以正式網域一定要列在這裡
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://gta-ch.edwardforce.tw}

server:
  port: ${SERVER_PORT}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

jwt:
  # 請勿將正式環境的 secret 寫死在版控裡，改用環境變數或 Vault/Secrets Manager 注入
  # 產生範例：openssl rand -base64 32
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}              # 會員 24 小時
  admin-expiration-ms: ${JWT_ADMIN_EXPIRATION_MS:28800000}  # 後台 ADMIN / STAFF 8 小時，權限大所以縮短

springdoc:
  # 預設關閉，避免 API 結構外洩；本機開發在 .env 設 SWAGGER_ENABLED=true 才開
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method   # 同一個 Tag 內依 HTTP method 排序
    tagsSorter: alpha

# 藍新金流（預設為測試環境 ccore；金鑰放 .env，正式環境改 core.newebpay.com 與正式商店資料）
# returnUrl / notifyUrl 必須是藍新連得到的公開網址，本機開發請用 ngrok 等工具轉發
newebpay:
  merchant-id: ${NEWEBPAY_MERCHANT_ID:}
  hash-key: ${NEWEBPAY_HASH_KEY:}
  hash-iv: ${NEWEBPAY_HASH_IV:}
  gateway-url: ${NEWEBPAY_GATEWAY_URL:https://ccore.newebpay.com/MPG/mpg_gateway}
  query-url: ${NEWEBPAY_QUERY_URL:https://ccore.newebpay.com/API/QueryTradeInfo}
  cancel-url: ${NEWEBPAY_CANCEL_URL:https://ccore.newebpay.com/API/CreditCard/Cancel}
  close-url: ${NEWEBPAY_CLOSE_URL:https://ccore.newebpay.com/API/CreditCard/Close}
  return-url: ${NEWEBPAY_RETURN_URL:http://localhost:8081/api/payments/newebpay/return}
  notify-url: ${NEWEBPAY_NOTIFY_URL:http://localhost:8081/api/payments/newebpay/notify}
