# =========================================================
# 洗車系統 Docker Compose
# 啟動：docker compose up -d --build
# 網址：http://localhost:8080/carwash/
#
# 設定來源：
#   ./.env          → 這個檔案用到的 ${變數}（資料庫 / Redis / MinIO 密碼、對外埠號）
#   ./backend/.env  → 後端自己的設定（JWT、Gmail、藍新金流…）
#   下面 backend.environment 會覆蓋 backend/.env 裡的連線位址，改成容器之間的名稱
# =========================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: carwash_db          # 第一次啟動自動建立資料庫，資料表交給 Flyway
      TZ: Asia/Taipei
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"   # 本機 Windows MySQL 已占用 3306，所以對外用 3307（DBeaver / Workbench 可連）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?請在 .env 設定 REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---------- MinIO（圖片儲存）----------
  minio:
    # MinIO 官方自 2025-10 起不再發布免費的 Docker 映像檔，改用 Chainguard 維護的免費版本
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: "0:0"     # 讓它能寫入新建立的 volume（避免權限不足）
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?請在 .env 設定 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?請在 .env 設定 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"   # MinIO 管理介面 http://localhost:9001

  # ---------- 後端 Spring Boot ----------
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/carwash_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_URL: /files              # 圖片網址改走前端 Nginx 的 /files/ 轉發
      SERVER_PORT: "8081"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/carwash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,https://gta-ch.edwardforce.tw}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    # 不對外開埠，只讓前端 Nginx 透過 /api/ 轉發；除錯時可把下面兩行取消註解
    # ports:
    #   - "8081:8081"

  # ---------- 前端 Vue + Nginx ----------
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  minio-data:
