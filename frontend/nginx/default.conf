# 容器內的 Nginx：提供前端靜態檔，並把 /api、/files 轉發到其他容器
# （backend、minio 是 docker-compose.yml 裡的服務名稱，Docker 內建 DNS 會解析成容器 IP）

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;   # 後端上傳上限 5MB，這裡稍微放寬

    # 根目錄導向前端首頁
    location = / {
        return 302 /carwash/;
    }

    # 前端 SPA：找不到實體檔案時一律回 index.html，交給 vue-router 處理
    location /carwash/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /carwash/index.html;
    }

    # 打包後檔名含 hash 的靜態資源可以長時間快取
    location /carwash/assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 轉發到後端
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host              $http_host;   # 保留埠號，後端判斷同源 / CORS 時才不會誤判
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上傳的圖片：/files/{bucket}/{檔名} → MinIO（bucket 已設為公開讀取）
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        expires 7d;
    }
}
